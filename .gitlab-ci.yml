stages:
  - verify
  - package

default:
  interruptible: true
  tags:
    - homelab
  before_script:
    - node --version
    - npm --version

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

verify:
  stage: verify
  script:
    - bash ops-static-test.sh
    - npm ci --ignore-scripts
    - npm test
    - npm run lint
    - npm run security

package-production:
  stage: package
  needs:
    - verify
  script:
    - mkdir -p dist
    - git archive --format=tar.gz --output="dist/encodium-${CI_COMMIT_SHA}.tgz" HEAD
    - test -s "dist/encodium-${CI_COMMIT_SHA}.tgz"
  artifacts:
    name: "encodium-${CI_COMMIT_SHORT_SHA}"
    paths:
      - "dist/encodium-${CI_COMMIT_SHA}.tgz"
    expire_in: 14 days
