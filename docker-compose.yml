# ══════════════════════════════════════════════════════════
#  Encodium — Docker Compose
# ══════════════════════════════════════════════════════════
#
#  Usage:
#    docker compose up -d          # CPU only
#    docker compose --profile nvidia up -d   # With NVIDIA GPU
#    docker compose --profile amd up -d      # With AMD/Intel VA-API
#
#  First run creates the admin account via CLI:
#    docker compose exec encodium node cli.js useradd admin@example.com yourpassword
#
#  Required environment variables (.env or shell):
#    DB_PASS        — database password (server refuses to start without it)
#    DB_ROOT_PASS   — database root password
#    JWT_SECRET     — required, at least 32 characters
#

services:
  # ── MariaDB ──────────────────────────────────────────────
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:?DB_ROOT_PASS is required}
      MARIADB_DATABASE: ${DB_NAME:-encodium}
      MARIADB_USER: ${DB_USER:-encodium}
      MARIADB_PASSWORD: ${DB_PASS:?DB_PASS is required}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Encodium (CPU) ──────────────────────────────────────
  encodium:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-encodium}
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      DB_NAME: ${DB_NAME:-encodium}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET (32+ characters) is required}
      PORT: 4000
      MEDIA_DIR: /media
      ENCODE_DIR: /app/data/encoded
      MAX_WORKERS: ${MAX_WORKERS:-2}
    volumes:
      # Mount your video library (read-only if you don't use replace-original)
      - ${MEDIA_DIR:-./data/media}:/media
      # Persist encoded files, thumbnails, logs
      - encodium_encoded:/app/data/encoded
      - encodium_thumbs:/app/data/thumbs
      - encodium_logs:/app/data/logs
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ── Encodium (NVIDIA GPU) ───────────────────────────────
  # Activate with: docker compose --profile nvidia up -d
  # Requires: nvidia-container-toolkit installed on the host
  encodium-gpu:
    build: .
    profiles: ["gpu", "nvidia"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-encodium}
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      DB_NAME: ${DB_NAME:-encodium}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET (32+ characters) is required}
      PORT: 4000
      MEDIA_DIR: /media
      ENCODE_DIR: /app/data/encoded
      MAX_WORKERS: ${MAX_WORKERS:-2}
      NVIDIA_VISIBLE_DEVICES: all
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-107}"
    volumes:
      - ${MEDIA_DIR:-./data/media}:/media
      - encodium_encoded:/app/data/encoded
      - encodium_thumbs:/app/data/thumbs
      - encodium_logs:/app/data/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ── Encodium (AMD/Intel VA-API) ──────────────────────────
  # Activate with: docker compose --profile amd up -d
  encodium-amd:
    build: .
    profiles: ["amd"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-encodium}
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      DB_NAME: ${DB_NAME:-encodium}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET (32+ characters) is required}
      PORT: 4000
      MEDIA_DIR: /media
      ENCODE_DIR: /app/data/encoded
      MAX_WORKERS: ${MAX_WORKERS:-2}
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-107}"
    volumes:
      - ${MEDIA_DIR:-./data/media}:/media
      - encodium_encoded:/app/data/encoded
      - encodium_thumbs:/app/data/thumbs
      - encodium_logs:/app/data/logs
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  db_data:
  encodium_encoded:
  encodium_thumbs:
  encodium_logs:
